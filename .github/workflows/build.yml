name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check_title_bindings.cjs
      - run: node tools/check_default_titles.cjs
      - run: python3 tools/balance_report.py
      - run: ./gradlew build --stacktrace
      - name: Dedicated server assertions
        run: |
          mkdir -p run
          mkdir -p run/config
          cp -r skilltree/rebuilt588/config/puffish_skills run/config/
          printf 'eula=true\n' > run/eula.txt
          set -o pipefail
          timeout 300 ./gradlew runServer -PtnkDirectXpSmoke -PtnkBossActivityServerSmoke --console=plain 2>&1 | tee smoke.log
          grep -q TNK_DIRECT_XP_SMOKE_OK smoke.log
          grep -q TNK_BOSS_ACTIVITY_SMOKE_OK smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tnkprogression-1.1.1-neoforge-1.21.1
          path: |
            build/libs/*.jar
            build/reports/tests/
            smoke.log
