name: Build and test
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check_title_bindings.cjs
      - run: node tools/check_commissions.cjs
      - run: python3 tools/balance_report.py
      - run: ./gradlew build --stacktrace
      - name: Dedicated server assertions
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          JAVA_TOOL_OPTIONS=-Dtnkprogression.smoke=true timeout 300 ./gradlew runServer 2>&1 | tee smoke.log
          grep -q TNK_PROGRESSION_SMOKE_OK smoke.log
          grep -q TNK_TITLES_SMOKE_OK smoke.log
          grep -q TNK_CHARACTER_SMOKE_OK smoke.log
          grep -q TNK_MOB_LEVEL_SMOKE_OK smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tnkprogression-beta
          path: |
            build/libs/*.jar
            build/reports/tests/
            smoke.log
