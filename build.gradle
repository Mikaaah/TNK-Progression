plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version = '1.1.1'
group = 'dev.mikaaah.tnkprogression'
base { archivesName = 'tnkprogression' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
 version = project.neo_version
 runs { server { server(); programArgument '--nogui' }; client { client() } }
 mods { tnkprogression { sourceSet(sourceSets.main) } }
}
if (providers.gradleProperty('tnkTitleSlotsSmoke').isPresent()) {
 neoForge.runs.client {
  systemProperty 'tnkprogression.titleSlotsSmoke', 'true'
  programArgument '--quickPlaySingleplayer'
  programArgument 'TNKTitleSlots'
  programArgument '--width'
  programArgument '1600'
  programArgument '--height'
  programArgument '1000'
 }
}
if (providers.gradleProperty('tnkOriginsSmoke').isPresent()) {
 neoForge.runs.client {
  systemProperty 'tnkprogression.originsSmoke', 'true'
  programArgument '--quickPlaySingleplayer'
  programArgument 'TNKOrigins'
  programArgument '--width'
  programArgument '1600'
  programArgument '--height'
  programArgument '1000'
 }
}
repositories { mavenCentral() }
dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher'; testRuntimeOnly 'com.google.code.gson:gson:2.10.1' }
tasks.named('test', Test) { useJUnitPlatform() }
java { withSourcesJar() }
tasks.named('processResources') { inputs.property('version', project.version); filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) } }
// Only appearance is bundled. The editable Pufferfish tree is supplied under config/puffish_skills.
tasks.named('processResources') {
 from('skilltree/resourcepack') { include 'assets/**'; include 'CREDITS.txt'; include 'HAS-LICENSE.txt' }
}

// This TNK development branch includes the permitted artwork as ordinary mod resources.
tasks.register('verifyBundledArtwork', Exec) {
 inputs.file('tools/verify_bundled_artwork.py')
 inputs.files(fileTree('src/main/resources/assets/tnkprogression'))
 inputs.file('src/main/resources/data/tnkprogression/default_titles.json')
 commandLine 'python3', 'tools/verify_bundled_artwork.py'
}
tasks.named('processResources') { dependsOn 'verifyBundledArtwork' }

// Optional: rebuild the badge overlay from the original archive, preserving its PNG bytes.
def prefixArtworkSource = providers.gradleProperty('tnkArtworkSource')
tasks.named('jar', Jar) {
 archiveFileName = "tnkprogression-${project.version}-neoforge-1.21.1.jar"
 if (prefixArtworkSource.isPresent()) {
  inputs.file(prefixArtworkSource.get()).withPropertyName('prefixArtwork')
  inputs.files('tools/embed_prefix_artwork.py', 'tools/package_number_prefixes.py', 'tools/package_title_prefixes.py')
  doLast {
   def builtJar = archiveFile.get().asFile.absolutePath
   project.exec { commandLine 'python3', 'tools/embed_prefix_artwork.py', builtJar, prefixArtworkSource.get(), builtJar }
  }
 }
}

if (providers.gradleProperty("tnkBossActivityServerSmoke").isPresent()) {
 neoForge.runs.server { systemProperty "tnkprogression.bossActivitySmoke", "true" }
}

if (providers.gradleProperty("tnkBossActivityClient").isPresent()) {
 neoForge.runs.client {
  systemProperty "tnkprogression.activityUiFixture", "true"
  programArgument "--quickPlaySingleplayer"
  programArgument "TNKActivities"
  programArgument "--width"
  programArgument "1360"
  programArgument "--height"
  programArgument "960"
 }
}

if (providers.gradleProperty("tnkDirectXpSmoke").isPresent()) { neoForge.runs.server { systemProperty "tnkprogression.directXpSmoke", "true" } }

// Isolated verification only. These jars are neither required nor bundled by production builds.
if (providers.gradleProperty('tnkAbyssSmoke').isPresent()) {
 sourceSets.main.java.srcDir('verification/abyss')
 dependencies { compileOnly fileTree(providers.gradleProperty('tnkVerificationJars').get()) { include '**/*.jar' } }
 neoForge.runs.server {
  gameDirectory = file(providers.gradleProperty('tnkVerificationRun').get())
  systemProperty 'tnkprogression.abyssSmoke', 'true'
 }
}
tasks.named('jar') { exclude 'dev/mikaaah/tnkprogression/verification/**', 'dev/mikaaah/tnkloot/verification/**' }
